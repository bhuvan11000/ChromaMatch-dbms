name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chromamatch
          POSTGRES_PASSWORD: chromamatch
          POSTGRES_DB: chromamatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chromamatch -d chromamatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chromamatch:chromamatch@localhost:5432/chromamatch
      DATABASE_URL_DIRECT: postgresql://chromamatch:chromamatch@localhost:5432/chromamatch
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: chromamatch
      SESSION_JWT_SECRET: e2e-session-secret-not-for-production-0001
      GAME_TOKEN_SECRET: e2e-game-token-secret-not-for-production-0002
      DAILY_SEED_SECRET: e2e-daily-seed-not-for-production-0003
      APP_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Initialize MongoDB
        run: npm run mongo:init

      - name: Seed achievements
        run: npm run db:seed

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/chromamatch-playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ runner.temp }}/chromamatch-playwright/playwright-report/
            ${{ runner.temp }}/chromamatch-playwright/test-results/
          retention-days: 7
